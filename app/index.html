<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, initial-scale=1.0" />
    <title>Home</title>
    <style>html, body { margin: 0; background: #000; }</style>
    <script>
      document.addEventListener("webOSRelaunch", function () {
        if (!document.hidden) return;
        var sys = window.PalmSystem || window.webOSSystem;
        function activate() {
          try { if (sys && sys.activate) sys.activate(); } catch (e) {}
        }
        if (typeof window.PalmServiceBridge !== "function") return;
        var bridge = new window.PalmServiceBridge();
        bridge.onservicecallback = function (body) {
          var msg = {};
          try { msg = JSON.parse(body); } catch (e) {}
          var id = msg.appId || "";
          if (!id || id === "com.webos.app.home" || id === "io.github.batmanrises.slopium") return;
          var closer = new window.PalmServiceBridge();
          closer.onservicecallback = function () { activate(); };
          closer.call("luna://com.webos.applicationManager/closeByAppId", JSON.stringify({ id: id }));
        };
        bridge.call("luna://com.webos.applicationManager/getForegroundAppInfo", "{}");
      });
    </script>
    <script src="./assets/config-seed.js"></script>
    <script src="./assets/persist.js"></script>
    <script defer src="./assets/wallpapers.js"></script>
    <script defer src="./assets/monomasks.js"></script>
    <script defer src="./assets/system.js"></script>
    <script defer src="./assets/metrics.js"></script>
    <script defer src="./assets/inputs.js"></script>
    <script defer src="./assets/power.js"></script>
    <script defer src="./assets/privacy.js"></script>
    <script defer src="./assets/memory.js"></script>
    <script defer src="./assets/hdmiads.js"></script>
    <script defer src="./assets/app.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
